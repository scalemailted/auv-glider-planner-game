name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Verify vendored Three.js runtime
        run: npm.cmd run check:three-vendor
      - name: Verify vendored Three.js Git tracking
        run: npm.cmd run check:three-vendor-git
      - name: Run project checks
        run: npm.cmd run check
      - name: Build static Pages artifact
        run: npm.cmd run build:pages
      - name: Assert Pages artifact contains Three runtime
        shell: pwsh
        run: |
          if (!(Test-Path '_site/vendor/three/build/three.module.js')) { throw 'Missing _site/vendor/three/build/three.module.js' }
          if (!(Test-Path '_site/vendor/three/build/three.core.js')) { throw 'Missing _site/vendor/three/build/three.core.js' }
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
